<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-y-auto bg-card dark:bg-transparent">

    <!-- Header -->
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-4 px-6 md:px-8 border-b">
        <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <div class="flex flex-col">
            <div class="flex flex-wrap items-center font-medium">
                <a [routerLink]="['list']" [relativeTo]="moduleRoute" class="whitespace-nowrap text-primary-500 cursor-pointer">{{text.title}}</a>
                <mat-icon class="icon-size-5 text-secondary mx-1" [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                <span>{{isEdit ? setup.paymentTypeName : text.newLabel}}</span>
            </div>
            <div class="text-3xl font-extrabold tracking-tight mt-2">{{isEdit ? 'Edit ' + setup.paymentTypeName : text.newLabel}}</div>
        </div>
        <div class="flex flex-shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <button *ngIf="isEdit" class="mr-3" mat-stroked-button color="warn" [disabled]="isLoading" (click)="delete()">
                <mat-icon [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                <span class="ml-2 mr-1">Delete</span>
            </button>
            <button mat-flat-button [color]="'primary'" [disabled]="isLoading" (click)="save()">
                <mat-icon [svgIcon]="'heroicons_outline:check'"></mat-icon>
                <span class="ml-2 mr-1">Save</span>
            </button>
        </div>
    </div>

    <div class="px-6 md:px-8 pt-4">
        <fuse-alert [appearance]="'soft'" [dismissible]="true" [dismissed]="true" [name]="'successMessage'" [type]="'success'">
            {{resultMessage}}
        </fuse-alert>
        <fuse-alert [appearance]="'soft'" [dismissible]="true" [dismissed]="true" [name]="'errorMessage'" [type]="'error'">
            {{resultMessage}}
        </fuse-alert>
    </div>

    <form [formGroup]="form" class="flex flex-col px-6 md:px-8 py-6 max-w-4xl">
        <div class="text-secondary mb-4">{{text.subtitle}} Several payment types can use the same account.</div>
        <div class="flex flex-col md:flex-row md:gap-4">
            <app-lookup-select class="block w-full md:w-1/2" formControlName="paymentTypeId" [options]="paymentTypes"
                idKey="paymentTypeId" [codeKey]="null" nameKey="paymentTypeName" label="Payment type"
                placeholder="Select payment type..." [required]="true" appearance="outline"
                errorMessage="Please select a payment type">
            </app-lookup-select>
            <app-lookup-select class="block w-full md:w-1/2" formControlName="accountChartId" [options]="accounts"
                idKey="accountId" codeKey="accountCode" nameKey="accountName" [label]="text.accountLabel"
                placeholder="Select account..." [required]="true" appearance="outline"
                errorMessage="Please select an account">
            </app-lookup-select>
        </div>
        <div class="flex flex-col md:flex-row md:gap-4" *ngIf="isEdit">
            <mat-form-field appearance="outline" class="w-full md:w-1/4">
                <mat-label>Status</mat-label>
                <mat-select formControlName="status">
                    <mat-option *ngFor="let status of statuses" [value]="status.statusId">{{status.statusDescription}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </form>
</div>
